[package]
name = "omniboost"
version = "1.0.2"
description = "OmniBoost - one-click Windows performance optimizer"
authors = ["OmniFolio"]
edition = "2021"

[lib]
name = "omniboost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
panic = "abort"
